<style>

lay:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:26px}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;color:#b4a0fa;font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:9px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:25px}.card,.panel,.entry{background:#171821dd;border:1px solid var(--border);border-radius:17px;padding:20px}.stat{font-size:35px;font-weight:750;margin-top:11px}.panel{margin-bottom:20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar input{max-width:350px}.list{display:grid;gap:12px}.entry{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}.entry:hover{border-color:#706387}.entry h3{margin:0 0 5px;font-size:16px}.entry p{margin:0;font-size:13px}.pill{border:1px solid #4b3c6a;background:#2a213a;border-radius:999px;padding:5px 9px;color:#c8b8ff;font-size:12px;white-space:nowrap}.auth{width:min(440px,calc(100% - 32px));margin:9vh auto;background:#181923;border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 30px 90px #0006}.auth h1{margin-bottom:8px}.stack{display:grid;gap:15px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}.modalbg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10;padding:15px}.modal{width:min(850px,100%);max-height:95vh;overflow:auto;background:#191a25;border:1px solid #444058;border-radius:18px;padding:25px}.modalheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{background:#282033;border:1px solid #654b83;color:#e2ceff;border-radius:12px;padding:12px;margin-bottom:15px}.error{color:#ffabb2}.hidden{display:none!important}.media{display:flex;gap:10px;flex-wrap:wrap}.media img{width:145px;height:120px;object-fit:cover;border-radius:9px}.mediaitem{max-width:180px;overflow-wrap:anywhere}.linkrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:9px 0}.empty{padding:55px 18px;text-align:center;color:var(--muted);border:1px dashed #343445;border-radius:16px}.detail-body{white-space:pre-wrap;color:#d7d5e0;line-height:1.65}.timeline{border-left:2px solid #52416f;padding-left:20px}.timeline .entry{margin-bottom:12px;position:relative}.timeline .entry:before{content:'';position:absolute;width:9px;height:9px;background:#ab90ff;border-radius:50%;left:-26px;top:25px}.toast{position:fixed;bottom:22px;right:22px;z-index:30;background:#2d2441;color:#fff;padding:15px 20px;border:1px solid #766197;border-radius:12px;max-width:330px;box-shadow:0 10px 30px #0006}.searchsmall{max-width:220px}.footer{font-size:12px;color:#72758b;margin-top:30px}.desktop{display:block}@media(max-width:790px){.layout{display:block}.sidebar{width:100%;height:auto;position:relative;border-right:0;border-bottom:1px solid var(--border);padding:16px}.sidebar .sub{margin-bottom:8px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidebottom{position:static;display:flex;gap:10px;margin-top:10px}.main{padding:24px 16px}.formgrid{grid-template-columns:1fr}.top{flex-wrap:wrap}.auth{margin:5vh auto;padding:24px}.modal{padding:17px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const URL_SUPA='https://jinkemawyrxqryrpsbrs.supabase.co';
const KEY_SUPA='sb_publishable_TWiv7uxwTqeBSAsyXICBGA_6NVufQxX';
const db=window.supabase.createClient(URL_SUPA,KEY_SUPA);
const kinds={person:'Personen',event:'Ereignisse',chapter:'Lebenskapitel',diary:'Tagebuch',capsule:'Zeitkapseln',place:'Orte'};
const navs=[['dashboard','Übersicht'],['timeline','Zeitstrahl'],['person','Personen'],['event','Ereignisse'],['chapter','Lebenskapitel'],['diary','Tagebuch'],['media','Medien'],['place','Orte'],['capsule','Zeitkapseln'],['calendar','Kalender'],['settings','Einstellungen']];
let state={user:null,items:[],links:[],media:[],prefs:null,view:'dashboard',search:'',detail:null,filter:'',vault:false,lockEntry:false};
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.add('hidden'),4500);}
function err(e){toast('Fehler: '+(e?.message||e));console.error(e);}
function fmt(d){if(!d)return 'Kein Datum';let x=new Date(d+'T12:00:00');return Number.isNaN(x.getTime())?esc(d):x.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});}
function dateToday(){return new Date().toLocaleDateString('en-CA');}
function dateValue(v){return v?String(v).slice(0,10):'';}
function uid(){return state.user?.id;}
function ready(){return !!state.user&&state.vault;}
function isLocked(item){return item.kind==='capsule'&&item.unlock_at&&new Date(item.unlock_at)>new Date();}
function itemName(id){return state.items.find(x=>x.id===id)?.title||'Gelöschter Eintrag';}
function yearsSince(d){if(!d)return null;let x=new Date(d+'T12:00:00'),t=new Date();let n=t.getFullYear()-x.getFullYear();if(t.getMonth()<x.getMonth()||(t.getMonth()===x.getMonth()&&t.getDate()<x.getDate()))n--;return n;}
function render(){if(!state.user){authView();return;}if(!state.vault){vaultView();return;}let nav=navs.map(([k,t])=>'<button class="'+(state.view===k?'active':'')+'" data-view="'+k+'">'+esc(t)+'</button>').join('');app.innerHTML='<div class="layout"><aside class="sidebar"><div class="brand">LIFE<span>ARCHIVE</span></div><div class="sub">Dein privates Lebensmuseum</div><nav class="nav">'+nav+'</nav><div class="sidebottom"><button class="btn small" id="lock">Sperren</button> <button class="btn small" id="logout">Abmelden</button></div></aside><main class="main" id="content"></main></div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.detail=null;state.filter='';render();});document.getElementById('logout').onclick=logout;document.getElementById('lock').onclick=()=>{state.vault=false;state.items=[];state.links=[];state.media=[];render();};page();}
function title(h,sub,action){return '<div class="top"><div><div class="eyebrow">LIFEARCHIVE</div><h1>'+esc(h)+'</h1><p>'+esc(sub||'')+'</p></div>'+(action||'')+'</div>';}
function makeButton(text,id){return '<button class="btn primary" id="'+id+'">'+esc(text)+'</button>';}
function authView(){app.innerHTML='<div class="auth"><div class="brand">LIFE<span style="color:var(--accent)">ARCHIVE</span></div><p>Privates Lebensarchiv. Melde dich mit deinem persönlichen Konto an.</p><form id="login" class="stack"><label>E-Mail-Adresse<input name="email" type="email" autocomplete="email" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="btn primary" type="submit">Anmelden</button></form><p style="margin-top:20px;font-size:13px">Noch kein Konto? <button id="signup" class="btn small">Konto erstellen</button></p><p style="font-size:12px">Nur angemeldete Personen erhalten Zugriff auf ihre eigenen Daten. Erstelle kein fremdes Konto.</p></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)err(error);};document.getElementById('signup').onclick=signupView;}
function signupView(){app.innerHTML='<div class="auth"><h1>Privates Konto erstellen</h1><p>Für dein persönliches Archiv. Bei aktivierter E-Mail-Bestätigung musst du deine Adresse zuerst bestätigen.</p><form id="reg" class="stack"><label>E-Mail<input name="email" type="email" required></label><label>Passwort (mindestens 12 Zeichen)<input name="password" type="password" minlength="12" required></label><button class="btn primary">Registrieren</button></form><button class="btn" id="back" style="margin-top:16px">Zurück</button></div>';document.getElementById('back').onclick=authView;document.getElementById('reg').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.auth.signUp({email:f.get('email'),password:f.get('password')});if(error)err(error);else{toast('Registrierung gesendet. Prüfe gegebenenfalls deine E-Mails.');authView();}};}
async function hashCode(code,salt){let raw=new TextEncoder().encode(salt+':'+code);let material=await crypto.subtle.importKey('raw',raw,{name:'PBKDF2'},false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('life-archive-v1'),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function vaultView(){let configured=!!state.prefs?.vault_hash;app.innerHTML='<div class="auth"><div class="brand">LIFE<span style="color:var(--accent)">ARCHIVE</span></div><h1 style="margin-top:28px">'+(configured?'Archiv entsperren':'Archivcode festlegen')+'</h1><p>'+(configured?'Gib deinen Archivcode ein.':'Lege einen zusätzlichen lokalen App-Code fest. Die tatsächliche Zugriffssicherheit erfolgt über dein Supabase-Konto und Datenbankregeln.')+'</p><form id="vaultform" class="stack"><label>Archivcode<input name="code" type="password" minlength="6" autocomplete="off" required></label><button class="btn primary">'+(configured?'Entsperren':'Code einrichten')+'</button></form><p style="font-size:12px;margin-top:16px">Hinweis: Dieser zusätzliche Code ist eine App-Sperre, keine serverseitige zweite Authentifizierung. Ein angemeldetes Konto ist weiterhin entscheidend.</p><button id="signout" class="btn small">Abmelden</button></div>';document.getElementById('signout').onclick=logout;document.getElementById('vaultform').onsubmit=async e=>{e.preventDefault();try{let code=new FormData(e.target).get('code');if(configured){let h=await hashCode(code,state.prefs.vault_salt);if(h!==state.prefs.vault_hash)throw Error('Falscher Archivcode');}else{let salt=crypto.randomUUID();let h=await hashCode(code,salt);let {error}=await db.from('archive_preferences').upsert({user_id:uid(),vault_salt:salt,vault_hash:h});if(error)throw error;state.prefs={...(state.prefs||{}),vault_salt:salt,vault_hash:h};}state.vault=true;await loadAll();}catch(ex){err(ex);}};}
async function loadPrefs(){let {data,error}=await db.from('archive_preferences').select('*').eq('user_id',uid()).maybeSingle();if(error)throw error;state.prefs=data||{};}
async function loadAll(){if(!ready())return;try{let results=await Promise.all([db.from('archive_items').select('*').order('event_date',{ascending:false,nullsFirst:false}).limit(5000),db.from('archive_links').select('*').limit(10000),db.from('archive_media').select('*').order('created_at',{ascending:false}).limit(5000)]);for(let r of results)if(r.error)throw r.error;[state.items,state.links,state.media]=results.map(x=>x.data||[]);render();}catch(e){err(e);render();}}
async function logout(){state.vault=false;state.items=[];state.links=[];state.media=[];await db.auth.signOut();render();}
function page(){let c=document.getElementById('content');if(state.detail){showDetail(state.detail);return;}if(state.view==='dashboard')dashboard(c);else if(state.view==='timeline')listing(c,'event',true);else if(kinds[state.view])listing(c,state.view,false);else if(state.view==='media')mediaPage(c);else if(state.view==='calendar')calendar(c);else if(state.view==='settings')settings(c);}
function itemCard(x){let subtitle=[fmt(x.event_date),x.category,x.location].filter(Boolean).join(' · ');return '<article class="entry" data-item="'+esc(x.id)+'"><div><h3>'+esc(x.title||'(Ohne Titel)')+'</h3><p>'+esc(subtitle)+'</p></div><span class="pill">'+esc(kinds[x.kind]||x.kind)+'</span></article>';}
function bindItems(){document.querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>{state.detail=el.dataset.item;render();});}
function dashboard(c){let n=k=>state.items.filter(x=>x.kind===k).length;let age=yearsSince(state.prefs?.birth_date);let today=new Date();let ann=state.items.filter(x=>x.event_date&&new Date(x.event_date+'T12:00:00')<today&&Number(x.event_date.slice(5,7))===today.getMonth()+1&&Number(x.event_date.slice(8,10))===today.getDate()&&x.event_date.slice(0,4)!==String(today.getFullYear()));let recent=state.items.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,5);c.innerHTML=title('Dein Leben. Dein Archiv.','Willkommen'+(state.prefs?.display_name?', '+state.prefs.display_name:'')+'. Alles, was bleibt, beginnt hier.',makeButton('+ Erinnerung','add-home'))+'<div class="cards">'+[['Lebensjahre',age===null?'–':age],['Personen',n('person')],['Ereignisse',n('event')],['Kapitel',n('chapter')],['Tagebucheinträge',n('diary')],['Medien',state.media.length]].map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="stat">'+b+'</div></div>').join('')+'</div><section class="panel"><h2>Heute vor einigen Jahren</h2>'+(ann.length?ann.map(itemCard).join(''):'<p>Für diesen Tag sind noch keine Erinnerungen gespeichert.</p>')+'</section><section class="panel"><h2>Zuletzt hinzugefügt</h2>'+(recent.length?'<div class="list">'+recent.map(itemCard).join('')+'</div>':'<div class="empty">Dein Archiv ist noch leer. Beginne mit deiner ersten Erinnerung.</div>')+'</section>';document.getElementById('add-home').onclick=()=>editItem(null,'event');bindItems();}
function listing(c,kind,timeline){let source=timeline?state.items.filter(x=>x.event_date):state.items.filter(x=>x.kind===kind);let q=state.search.toLowerCase();source=source.filter(x=>(x.title+' '+x.body+' '+x.category+' '+x.location+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q));source.sort((a,b)=>String(b.event_date||b.created_at).localeCompare(String(a.event_date||a.created_at)));let h=timeline?'Lebenszeitstrahl':kinds[kind];c.innerHTML=title(h,timeline?'Jeder Moment deiner Lebensgeschichte, chronologisch erfasst.':'Dein persönliches Archiv, vollständig selbst verwaltbar.',makeButton('+ '+(timeline?'Ereignis':'Eintrag'),'add-item'))+'<div class="toolbar"><input id="query" placeholder="Suchen nach Titel, Ort, Text, Schlagwort..." value="'+esc(state.search)+'"><span class="muted">'+source.length+' Einträge</span></div>'+(source.length?'<div class="'+(timeline?'timeline':'list')+'" id="results">'+source.map(itemCard).join('')+'</div>':'<div id="results" class="empty">Noch keine passenden Einträge vorhanden</div>');document.getElementById('add-item').onclick=()=>editItem(null,timeline?'event':kind);document.getElementById('query').oninput=e=>{state.search=e.target.value;let hits=(timeline?state.items.filter(x=>x.event_date):state.items.filter(x=>x.kind===kind)).filter(x=>(x.title+' '+x.body+' '+x.category+' '+x.location+' '+(x.tags||[]).join(' ')).toLowerCase().includes(state.search.toLowerCase())).sort((a,b)=>String(b.event_date||b.created_at).localeCompare(String(a.event_date||a.created_at)));document.getElementById('results').innerHTML=hits.length?hits.map(itemCard).join(''):'Keine Treffer';bindItems();};bindItems();}
function showDetail(id){let x=state.items.find(a=>a.id===id);if(!x){state.detail=null;render();return;}let c=document.getElementById('content');let locked=isLocked(x);let links=state.links.filter(l=>l.source_id===id||l.target_id===id).map(l=>state.items.find(y=>y.id===(l.source_id===id?l.target_id:l.source_id))).filter(Boolean);let medias=state.media.filter(m=>m.item_id===id);c.innerHTML=title(x.title||'(Ohne Titel)',kinds[x.kind]+' · '+fmt(x.event_date),'<button class="btn" id="back">← Zurück</button>')+'<section class="panel">'+(locked?'<div class="notice">Diese Zeitkapsel öffnet am '+esc(new Date(x.unlock_at).toLocaleString('de-DE'))+'.</div>':'<div class="detail-body">'+esc(x.body||'Keine Beschreibung vorhanden')+'</div><p style="margin-top:20px">'+esc([x.location,x.category,(x.tags||[]).join(', ')].filter(Boolean).join(' · '))+'</p>')+'</section>'+(locked?'':'<section class="panel"><h2>Verknüpfte Personen und Ereignisse</h2><div class="list">'+(links.length?links.map(itemCard).join(''):'<p>Keine Verknüpfungen</p>')+'</div></section><section class="panel"><h2>Medien</h2><div id="detailmedia" class="media">Medien werden geladen...</div><div class="actions"><input id="upload" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt" style="max-width:350px"><button class="btn" id="uploadbtn">Hochladen</button></div></section>')+'<div class="actions"><button class="btn primary" id="edit">Bearbeiten</button><button class="btn danger" id="delete">Löschen</button></div>';document.getElementById('back').onclick=()=>{state.detail=null;render();};document.getElementById('edit').onclick=()=>editItem(x);document.getElementById('delete').onclick=()=>deleteItem(x);bindItems();if(!locked){paintMedia(medias,document.getElementById('detailmedia'));document.getElementById('uploadbtn').onclick=()=>uploadFiles(document.getElementById('upload').files,id);}}
function field(n,lab,val,type='text',extra=''){return '<label>'+esc(lab)+'<input name="'+n+'" type="'+type+'" value="'+esc(val||'')+'" '+extra+'></label>';}
function editItem(x,defaultKind){let kind=x?.kind||defaultKind||'event';let overlay=document.createElement('div');overlay.className='modalbg';overlay.innerHTML='<div class="modal"><div class="modalheader"><h2>'+(x?'Eintrag bearbeiten':'Neuer Eintrag')+'</h2><button class="btn small" id="closemodal">Schließen</button></div><form id="itemform" class="formgrid"><label>Bereich<select name="kind">'+Object.entries(kinds).map(([k,v])=>'<option value="'+k+'" '+(kind===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+field('title','Titel / Name',x?.title||'','text','required')+field('event_date','Datum',x?.event_date,'date')+field('event_time','Uhrzeit',x?.event_time,'time')+field('location','Ort',x?.location)+field('category','Kategorie / Beziehung / Status',x?.category)+field('status','Status / Kurzinfo',x?.status)+field('tags','Schlagwörter, mit Komma getrennt',(x?.tags||[]).join(', '))+'<label class="wide">Beschreibung / Gedanken<textarea name="body">'+esc(x?.body||'')+'</textarea></label><label>Bewertung des Tages (1–5)<select name="rating"><option value="">Keine</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(x?.rating===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+field('unlock_at','Zeitkapsel öffnen ab',x?.unlock_at?x.unlock_at.slice(0,16):'','datetime-local')+'<label class="wide"><input name="is_sensitive" type="checkbox" '+(x?.is_sensitive?'checked':'')+'> Als sensibel markieren (Hinweis, keine separate Verschlüsselung)</label><div class="wide"><h3>Personen, Ereignisse, Kapitel verknüpfen</h3><div style="max-height:150px;overflow:auto">'+state.items.filter(y=>y.id!==x?.id).map(y=>'<label class="linkrow"><input type="checkbox" name="related" value="'+esc(y.id)+'" '+(x&&state.links.some(l=>(l.source_id===x.id&&l.target_id===y.id)||(l.target_id===x.id&&l.source_id===y.id))?'checked':'')+'>'+esc(y.title)+' <span class="pill">'+esc(kinds[y.kind])+'</span></label>').join('')+'</div></div><div class="wide actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" id="cancel">Abbrechen</button></div></form></div>';document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.querySelector('#closemodal').onclick=close;overlay.querySelector('#cancel').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close();});overlay.querySelector('#itemform').onsubmit=async e=>{e.preventDefault();let btn=e.submitter;btn.disabled=true;try{let f=new FormData(e.target);let val=n=>String(f.get(n)||'').trim();let data={kind:val('kind'),title:val('title'),event_date:val('event_date')||null,event_time:val('event_time')||null,location:val('location'),category:val('category'),status:val('status'),body:val('body'),tags:val('tags').split(',').map(s=>s.trim()).filter(Boolean),rating:val('rating')?Number(val('rating')):null,unlock_at:val('unlock_at')?new Date(val('unlock_at')).toISOString():null,is_sensitive:f.has('is_sensitive'),user_id:uid()};let res=x?await db.from('archive_items').update(data).eq('id',x.id).select().single():await db.from('archive_items').insert(data).select().single();if(res.error)throw res.error;let saved=res.data;let selected=f.getAll('related');if(x){let del=await db.from('archive_links').delete().or('source_id.eq.'+x.id+',target_id.eq.'+x.id);if(del.error)throw del.error;}if(selected.length){let rows=selected.map(target=>({user_id:uid(),source_id:saved.id,target_id:target,relation:'related'}));let ins=await db.from('archive_links').insert(rows);if(ins.error)throw ins.error;}close();state.detail=saved.id;await loadAll();toast('Eintrag gespeichert');}catch(ex){err(ex);}finally{btn.disabled=false;}};}
async function deleteItem(x){if(!confirm('Diesen Eintrag endgültig löschen? Dateien bleiben zunächst im Medienarchiv.'))return;let {error}=await db.from('archive_items').delete().eq('id',x.id);if(error)return err(error);state.detail=null;await loadAll();toast('Eintrag gelöscht');}
async function uploadFiles(files,itemId){if(!files?.length)return toast('Bitte Dateien auswählen');for(let f of Array.from(files)){try{if(f.size>50*1024*1024)throw Error('Datei zu groß (max. 50 MB): '+f.name);let path=uid()+'/'+crypto.randomUUID()+'/'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let uploaded=await db.storage.from('lifearchive-private').upload(path,f,{contentType:f.type||'application/octet-stream'});if(uploaded.error)throw uploaded.error;let ins=await db.from('archive_media').insert({user_id:uid(),item_id:itemId||null,storage_path:path,file_name:f.name,mime_type:f.type});if(ins.error){await db.storage.from('lifearchive-private').remove([path]);throw ins.error;}toast('Hochgeladen: '+f.name);}catch(e){err(e);}}await loadAll();}
async function paintMedia(media,el){if(!el)return;el.textContent='';if(!media.length){el.textContent='Keine Dateien';return;}for(let m of media){let wrap=document.createElement('div');wrap.className='mediaitem';let name=document.createElement('div');name.className='muted';name.style.fontSize='12px';name.textContent=m.file_name;let show=document.createElement('button');show.className='btn small';show.textContent='Öffnen';show.onclick=async()=>{let r=await db.storage.from('lifearchive-private').createSignedUrl(m.storage_path,60);if(r.error)return err(r.error);window.open(r.data.signedUrl,'_blank','noopener,noreferrer');};wrap.append(name,show);let remove=document.createElement('button');remove.className='btn small danger';remove.textContent='Löschen';remove.style.marginLeft='6px';remove.onclick=async()=>{if(!confirm('Datei dauerhaft aus dem Archiv löschen?'))return;try{const d=await db.storage.from('lifearchive-private').remove([m.storage_path]);if(d.error)throw d.error;const r=await db.from('archive_media').delete().eq('id',m.id).eq('user_id',uid());if(r.error)throw r.error;toast('Datei gelöscht');await loadAll();}catch(e){err(e);}};wrap.append(remove);if(m.mime_type?.startsWith('image/')){let r=await db.storage.from('lifearchive-private').createSignedUrl(m.storage_path,60);if(!r.error){let img=document.createElement('img');img.alt=m.file_name;img.src=r.data.signedUrl;wrap.prepend(img);}}el.append(wrap);}}
function mediaPage(c){c.innerHTML=title('Medienarchiv','Private Fotos, Videos, Audio und Dateien', '')+'<section class="panel"><div class="toolbar"><input id="files" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt"><button class="btn primary" id="sendfiles">Dateien hochladen</button></div><div class="media" id="gallery"></div></section>';document.getElementById('sendfiles').onclick=()=>uploadFiles(document.getElementById('files').files,null);paintMedia(state.media,document.getElementById('gallery'));}
function calendar(c){let yr=new Date().getFullYear();let events=state.items.filter(x=>x.event_date).sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date)));let grouped={};events.forEach(x=>{let y=x.event_date.slice(0,4);(grouped[y]??=[]).push(x);});c.innerHTML=title('Lebenskalender','Deine datierten Erinnerungen nach Jahren','')+Object.keys(grouped).sort((a,b)=>b-a).map(y=>'<section class="panel"><h2>'+y+'</h2><div class="list">'+grouped[y].map(itemCard).join('')+'</div></section>').join('')+(events.length?'':'<div class="empty">Noch keine datierten Ereignisse</div>');bindItems();}
function download(name,content,type){let blob=new Blob([content],{type});let a=document.createElement('a');let u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function settings(c){c.innerHTML=title('Einstellungen','Profil, Sicherungen und Datenschutz','')+'<section class="panel"><h2>Dein Profil</h2><form id="prefs" class="formgrid">'+field('display_name','Anzeigename',state.prefs?.display_name)+field('birth_date','Geburtsdatum',state.prefs?.birth_date,'date')+'<div class="wide"><button class="btn primary">Profil speichern</button></div></form></section><section class="panel"><h2>Datenexport</h2><p>JSON enthält deine Archivtexte, Verknüpfungen und Medien-Metadaten. Die eigentlichen hochgeladenen Dateien sind nicht im JSON enthalten und müssen separat gesichert werden.</p><button class="btn" id="json">JSON exportieren</button> <button class="btn" id="pdf">Druckansicht / Als PDF speichern</button></section><section class="panel"><h2>Archivcode ändern</h2><p>Zur Änderung wird der bisherige Code benötigt. Dieser zusätzliche App-Code ersetzt keinen serverseitigen Zugriffsschutz.</p><form id="codeform" class="stack" style="max-width:390px"><label>Bisheriger Code<input name="old" type="password" required></label><label>Neuer Code<input name="new" type="password" minlength="6" required></label><button class="btn">Code ändern</button></form></section><section class="panel"><h2>Datenschutz</h2><p>Alle Daten sind deinem angemeldeten Konto zugeordnet. Die Dateien befinden sich in einem privaten Storage-Bucket. Keine Daten werden öffentlich veröffentlicht.</p><button class="btn danger" id="wipe">Alle Archivtexte und Verknüpfungen löschen</button></section>';document.getElementById('prefs').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.from('archive_preferences').upsert({user_id:uid(),display_name:f.get('display_name'),birth_date:f.get('birth_date')||null});if(error)return err(error);await loadPrefs();render();toast('Profil gespeichert');};document.getElementById('json').onclick=()=>download('LIFEARCHIVE-'+dateToday()+'.json',JSON.stringify({version:1,exported_at:new Date().toISOString(),profile:{display_name:state.prefs?.display_name,birth_date:state.prefs?.birth_date},items:state.items,links:state.links,media:state.media},null,2),'application/json');document.getElementById('pdf').onclick=()=>{let w=window.open('','_blank');if(!w)return toast('Bitte Popups erlauben');let styles='<style>body{font:15px Arial;max-width:850px;margin:40px auto;color:#111}article{page-break-inside:avoid;border-bottom:1px solid #ddd;padding:14px 0}p{white-space:pre-wrap}</style>';w.document.write('<!doctype html><html><head><title>LIFEARCHIVE Export</title>'+styles+'</head><body><h1>LIFEARCHIVE</h1>'+state.items.map(x=>'<article><h2>'+esc(x.title)+'</h2><small>'+esc(kinds[x.kind])+' · '+esc(fmt(x.event_date))+'</small><p>'+esc(x.body)+'</p></article>').join('')+'<script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close();};document.getElementById('codeform').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);if(await hashCode(f.get('old'),state.prefs.vault_salt)!==state.prefs.vault_hash)throw Error('Alter Code falsch');let salt=crypto.randomUUID();let hash=await hashCode(f.get('new'),salt);let {error}=await db.from('archive_preferences').upsert({user_id:uid(),vault_salt:salt,vault_hash:hash});if(error)throw error;await loadPrefs();e.target.reset();toast('Code geändert');}catch(ex){err(ex);}};document.getElementById('wipe').onclick=async()=>{if(prompt('Zum Löschen aller Texte und Verknüpfungen genau LÖSCHEN eingeben')!=='LÖSCHEN')return;let {error}=await db.from('archive_items').delete().eq('user_id',uid());if(error)return err(error);await loadAll();toast('Archivtexte gelöscht. Medien bleiben erhalten.');};}
async function start(){try{let {data:{session}}=await db.auth.getSession();state.user=session?.user||null;if(state.user)await loadPrefs();render();}catch(e){err(e);authView();}}
db.auth.onAuthStateChange((_ev,session)=>{if(session?.user?.id!==state.user?.id){state.user=session?.user||null;state.vault=false;state.items=[];state.links=[];state.media=[];if(state.user)loadPrefs().then(render).catch(err);else render();}});
start();
</script></body></html>
